<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Removing the refusal direction from an activation by projection</title>
  <desc id="desc">Two coordinate-plane panels. The horizontal axis is the unit refusal direction r-hat; the vertical axis is the orthogonal complement that is preserved. Left (Before): the activation vector a leans about 25 degrees toward r-hat, casting a shadow of length 3.0 on it, so the dot product is 3.0 and the cosine of the angle is about 0.90. Right (After): the refusal component has been subtracted, leaving a_clean lying exactly along the orthogonal axis; its shadow on r-hat is zero, so the dot product is 0 and the cosine is 0.</desc>
  <defs>
    <style>
      .ttl  { font: 700 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #0f172a; }
      .sub  { font: 500 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #64748b; }
      .hdr  { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .axl  { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .vec  { font: 700 15px ui-monospace, Menlo, Consolas, monospace; }
      .chipk{ font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; letter-spacing: .06em; }
      .chipv{ font: 700 14.5px ui-monospace, Menlo, Consolas, monospace; }
      .cap  { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .foot { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #94a3b8; }
      .tick { font: 500 11px ui-monospace, Menlo, monospace; fill: #94a3b8; }
      .lab  { font: 600 11.5px ui-monospace, Menlo, monospace; }
    </style>
    <marker id="mx" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 z" fill="#334155"/></marker>
    <marker id="my" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="#cbd5e1"/></marker>
    <marker id="ma" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 z" fill="#7c3aed"/></marker>
    <marker id="mc" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 z" fill="#059669"/></marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/></marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 z" fill="#e11d48"/></marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardclip"><rect x="0" y="0" width="460" height="470" rx="16"/></clipPath>
    <!-- Shared coordinate plane (identical in both panels) -->
    <g id="plane">
      <rect x="0" y="0" width="460" height="470" rx="16" fill="#fbfcfe" stroke="#e6eaf1" stroke-width="1.5"/>
      <g clip-path="url(#cardclip)">
        <g stroke="#eef3f8" stroke-width="1">
          <line x1="72" y1="96" x2="72" y2="452"/><line x1="136" y1="96" x2="136" y2="452"/>
          <line x1="200" y1="96" x2="200" y2="452"/><line x1="264" y1="96" x2="264" y2="452"/>
          <line x1="328" y1="96" x2="328" y2="452"/><line x1="392" y1="96" x2="392" y2="452"/>
          <line x1="20" y1="180" x2="440" y2="180"/><line x1="20" y1="244" x2="440" y2="244"/>
          <line x1="20" y1="308" x2="440" y2="308"/><line x1="20" y1="372" x2="440" y2="372"/>
        </g>
        <ellipse cx="344" cy="372" rx="100" ry="66" fill="url(#glow)"/>
      </g>
      <!-- orthogonal (vertical) axis: the preserved complement -->
      <line x1="72" y1="372" x2="72" y2="120" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#my)"/>
      <text class="axl" transform="translate(46,250) rotate(-90)" text-anchor="middle">orthogonal to r&#770;  (preserved)</text>
      <!-- refusal (horizontal) axis -->
      <line x1="72" y1="372" x2="396" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#mx)"/>
      <text x="405" y="377" class="vec" fill="#334155">r&#770;</text>
      <text x="388" y="392" text-anchor="end" class="axl">more refusal &#8594;</text>
      <line x1="136" y1="368" x2="136" y2="376" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="136" y="389" text-anchor="middle" class="tick">1</text>
      <circle cx="72" cy="372" r="3.5" fill="#0f172a"/>
    </g>
  </defs>

  <rect width="1000" height="610" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" class="ttl">Projecting the refusal direction out of an activation</text>
  <text x="500" y="60" text-anchor="middle" class="sub">r&#770; = [2/3, 2/3, 1/3]      a = [3, 1, 1]      a_clean = a &#8722; (r&#770;&#183;a) r&#770; = [1, &#8722;1, 0]</text>

  <!-- ================= BEFORE ================= -->
  <g transform="translate(30,84)">
    <use href="#plane"/>
    <text x="230" y="35" text-anchor="middle" class="hdr" fill="#be123c">Before &#8212; the original activation</text>

    <!-- shadow (projection) on r-hat: 0 to 3.0 units -->
    <line x1="72" y1="372" x2="264" y2="372" stroke="#e11d48" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <line x1="264" y1="281.5" x2="264" y2="372" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="168" y="391" text-anchor="middle" class="lab" fill="#e11d48">shadow = 3.0</text>

    <!-- angle wedge -->
    <path d="M72 372 L124 372 A52 52 0 0 0 119.03 349.83 Z" fill="#7c3aed" opacity="0.12"/>
    <path d="M124 372 A52 52 0 0 0 119.03 349.83" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
    <text x="140" y="360" class="tick" fill="#6d28d9">&#952; &#8776; 25&#176;</text>

    <!-- activation vector a -->
    <line x1="72" y1="372" x2="264" y2="281.5" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#ma)"/>
    <text x="272" y="277" class="vec" fill="#7c3aed">a</text>

    <!-- readout chip -->
    <rect x="250" y="150" width="162" height="66" rx="10" fill="#ffffff" stroke="#e6eaf1" stroke-width="1.2"/>
    <text x="266" y="172" class="chipk">ALIGNMENT WITH r&#770;</text>
    <text x="266" y="192" class="chipv" fill="#0f172a">r&#770; &#183; a = 3.0</text>
    <text x="266" y="209" class="chipv" fill="#7c3aed">cos&#952; &#8776; 0.90</text>

    <text x="230" y="450" text-anchor="middle" class="cap">The activation leans toward refusal &#8212; a long shadow on r&#770;.</text>
  </g>

  <!-- ================= AFTER ================= -->
  <g transform="translate(510,84)">
    <use href="#plane"/>
    <text x="230" y="35" text-anchor="middle" class="hdr" fill="#047857">After &#8212; refusal component removed</text>

    <!-- ghost of original a -->
    <line x1="72" y1="372" x2="264" y2="281.5" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
    <text x="272" y="277" class="lab" fill="#94a3b8">a (before)</text>

    <!-- removed refusal component -->
    <line x1="264" y1="281.5" x2="88" y2="281.5" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mr)"/>
    <text x="176" y="274" text-anchor="middle" class="lab" fill="#be123c">&#8722; (r&#770; &#183; a) r&#770;</text>

    <!-- right-angle marker -->
    <path d="M88 372 V356 H72" fill="none" stroke="#475569" stroke-width="1.5"/>

    <!-- a_clean along the orthogonal axis -->
    <line x1="72" y1="372" x2="72" y2="281.5" stroke="#059669" stroke-width="3.5" marker-end="url(#mc)"/>
    <text x="82" y="316" class="vec" fill="#059669">a_clean</text>

    <!-- zero-shadow marker at origin -->
    <circle cx="72" cy="372" r="7" fill="none" stroke="#e11d48" stroke-width="2"/>

    <!-- readout chip -->
    <rect x="250" y="150" width="162" height="66" rx="10" fill="#ffffff" stroke="#e6eaf1" stroke-width="1.2"/>
    <text x="266" y="172" class="chipk">ALIGNMENT WITH r&#770;</text>
    <text x="266" y="192" class="chipv" fill="#0f172a">r&#770; &#183; a_clean = 0</text>
    <text x="266" y="209" class="chipv" fill="#059669">cos&#952; = 0</text>

    <text x="230" y="450" text-anchor="middle" class="cap">Only the part orthogonal to r&#770; survives &#8212; the shadow is zero.</text>
  </g>

  <!-- footnote -->
  <text x="500" y="596" text-anchor="middle" class="foot">Drawn to scale in the 2-D plane spanned by r&#770; and a &#8212; &#8214;a&#8214; = &#8730;11 &#8776; 3.32, projection = 3.0, orthogonal part = &#8730;2 &#8776; 1.41.</text>
</svg>
