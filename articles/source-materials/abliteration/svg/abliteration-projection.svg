<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Removing refusal from an activation by projection</title>
  <desc id="figDesc">Two side-by-side panels drawn to scale in the 2-D plane containing the unit refusal direction r-hat and the activation a. Before: the activation a = [3, 1, 1] sits about 25 degrees off the refusal direction, with a shadow (dot product) of 3.0 units reaching into a cloud of refusal activations. After: subtracting 3.0 times r-hat leaves a_clean = [1, -1, 0], a vector of length root 2 that is exactly perpendicular to the refusal direction, so its projection onto r-hat is zero.</desc>

  <defs>
    <style>
      .sans   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
      .title  { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub    { font-size: 14px; fill: #475569; }
      .foot   { font-size: 12px; fill: #94a3b8; font-weight: 400; }
      .hdr    { font-size: 15px; font-weight: 700; }
      .cap    { font-size: 14px; font-weight: 600; fill: #334155; }
      .lbl    { font-size: 13px; font-weight: 600; fill: #64748b; }
      .lblsm  { font-size: 12px; font-weight: 600; fill: #64748b; }
      .ghostl { font-size: 12.5px; font-weight: 600; fill: #94a3b8; }
    </style>

    <marker id="ah-grey" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto">
      <path d="M1,1 L12,5.5 L1,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ah-ghost" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M1,1 L13,6 L1,11 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="ah-violet" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M1,1 L14,6 L1,11 Z" fill="#7c3aed"/>
    </marker>
    <marker id="ah-green" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M1,1 L14,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="ah-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M1,1 L13,5.5 L1,10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- ================= TOP MATTER ================= -->
  <text class="sans title" x="490" y="38" text-anchor="middle">Removing refusal from an activation by projection</text>
  <text class="mono sub" x="490" y="63" text-anchor="middle" font-weight="700" xml:space="preserve">r&#x0302; = [2/3, 2/3, 1/3] (unit)   a = [3, 1, 1] &#8594; a_clean = [1, &#8722;1, 0]</text>

  <!-- ================= PANEL A : BEFORE ================= -->
  <rect x="20" y="84" width="455" height="412" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="sans hdr" x="44" y="118" fill="#be123c">Before &#8212; original activation a</text>

  <!-- refusal cloud (tint + dots) -->
  <ellipse cx="310" cy="338" rx="62" ry="40" fill="#fee2e2" opacity="0.9"/>
  <g fill="#f43f5e">
    <circle cx="268" cy="330" r="4" opacity="0.80"/>
    <circle cx="280" cy="352" r="4" opacity="0.65"/>
    <circle cx="286" cy="316" r="4" opacity="0.75"/>
    <circle cx="314" cy="326" r="4" opacity="0.85"/>
    <circle cx="322" cy="358" r="4" opacity="0.62"/>
    <circle cx="334" cy="334" r="4" opacity="0.80"/>
    <circle cx="344" cy="350" r="4" opacity="0.70"/>
    <circle cx="354" cy="324" r="4" opacity="0.66"/>
    <circle cx="326" cy="312" r="4" opacity="0.78"/>
    <circle cx="288" cy="364" r="4" opacity="0.60"/>
    <circle cx="350" cy="358" r="4" opacity="0.72"/>
    <circle cx="308" cy="306" r="4" opacity="0.68"/>
  </g>
  <text class="sans lbl" x="348" y="288" text-anchor="middle" fill="#be123c">refusal cloud</text>

  <!-- harmless cluster -->
  <ellipse cx="82" cy="432" rx="36" ry="27" fill="#93c5fd" opacity="0.28"/>
  <g fill="#60a5fa">
    <circle cx="62" cy="426" r="4" opacity="0.80"/>
    <circle cx="74" cy="442" r="4" opacity="0.68"/>
    <circle cx="84" cy="420" r="4" opacity="0.85"/>
    <circle cx="94" cy="436" r="4" opacity="0.72"/>
    <circle cx="102" cy="424" r="4" opacity="0.64"/>
    <circle cx="68" cy="446" r="4" opacity="0.60"/>
    <circle cx="88" cy="446" r="4" opacity="0.75"/>
    <circle cx="106" cy="440" r="4" opacity="0.62"/>
  </g>
  <text class="sans lblsm" x="82" y="478" text-anchor="middle">harmless</text>

  <!-- axis = refusal direction -->
  <line x1="72" y1="372" x2="438" y2="372" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-grey)"/>
  <line x1="162" y1="374" x2="162" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="sans lblsm" x="162" y="396" text-anchor="middle">1</text>
  <text class="sans lbl" x="438" y="400" text-anchor="end">refusal direction (r&#x0302;)</text>

  <!-- projection (shadow) on the axis -->
  <line x1="96" y1="372" x2="294" y2="372" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
  <!-- drop line from tip of a to the axis -->
  <line x1="294" y1="278.7" x2="294" y2="372" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- activation vector a -->
  <line x1="96" y1="372" x2="294" y2="278.7" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#ah-violet)"/>
  <text class="mono" x="185" y="312" text-anchor="end" font-size="16" fill="#7c3aed">a</text>
  <text class="mono" x="185" y="291" text-anchor="end" font-size="11.5" font-weight="400" fill="#94a3b8">&#8214;a&#8214; = &#8730;11</text>

  <!-- angle arc -->
  <path d="M 174 372 A 78 78 0 0 0 166.5 338.7" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text class="sans" x="201" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">&#952; &#8776; 25&#176;</text>

  <!-- measurement bracket for the dot product -->
  <line x1="96" y1="402" x2="294" y2="402" stroke="#e11d48" stroke-width="1.5"/>
  <line x1="96" y1="392" x2="96" y2="402" stroke="#e11d48" stroke-width="1.5"/>
  <line x1="294" y1="392" x2="294" y2="402" stroke="#e11d48" stroke-width="1.5"/>
  <text class="mono" x="195" y="424" text-anchor="middle" font-size="14" fill="#be123c">r&#x0302; &#183; a = 3.0</text>

  <circle cx="96" cy="372" r="3.5" fill="#64748b"/>

  <text class="sans cap" x="247.5" y="522" text-anchor="middle">cos &#952; &#8776; 0.90  &#8226;  strongly refusal-flavoured</text>

  <!-- ================= PANEL B : AFTER ================= -->
  <rect x="505" y="84" width="455" height="412" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="sans hdr" x="529" y="118" fill="#047857">After &#8212; refusal removed (a_clean)</text>

  <!-- refusal cloud (identical placement + scale) -->
  <ellipse cx="795" cy="338" rx="62" ry="40" fill="#fee2e2" opacity="0.9"/>
  <g fill="#f43f5e">
    <circle cx="753" cy="330" r="4" opacity="0.80"/>
    <circle cx="765" cy="352" r="4" opacity="0.65"/>
    <circle cx="771" cy="316" r="4" opacity="0.75"/>
    <circle cx="799" cy="326" r="4" opacity="0.85"/>
    <circle cx="807" cy="358" r="4" opacity="0.62"/>
    <circle cx="819" cy="334" r="4" opacity="0.80"/>
    <circle cx="829" cy="350" r="4" opacity="0.70"/>
    <circle cx="839" cy="324" r="4" opacity="0.66"/>
    <circle cx="811" cy="312" r="4" opacity="0.78"/>
    <circle cx="773" cy="364" r="4" opacity="0.60"/>
    <circle cx="835" cy="358" r="4" opacity="0.72"/>
    <circle cx="793" cy="306" r="4" opacity="0.68"/>
  </g>
  <text class="sans lbl" x="833" y="288" text-anchor="middle" fill="#be123c">refusal cloud</text>

  <!-- harmless cluster -->
  <ellipse cx="567" cy="432" rx="36" ry="27" fill="#93c5fd" opacity="0.28"/>
  <g fill="#60a5fa">
    <circle cx="547" cy="426" r="4" opacity="0.80"/>
    <circle cx="559" cy="442" r="4" opacity="0.68"/>
    <circle cx="569" cy="420" r="4" opacity="0.85"/>
    <circle cx="579" cy="436" r="4" opacity="0.72"/>
    <circle cx="587" cy="424" r="4" opacity="0.64"/>
    <circle cx="553" cy="446" r="4" opacity="0.60"/>
    <circle cx="573" cy="446" r="4" opacity="0.75"/>
    <circle cx="591" cy="440" r="4" opacity="0.62"/>
  </g>
  <text class="sans lblsm" x="567" y="478" text-anchor="middle">harmless</text>

  <!-- axis -->
  <line x1="557" y1="372" x2="923" y2="372" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-grey)"/>
  <line x1="647" y1="374" x2="647" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="sans lblsm" x="647" y="396" text-anchor="middle">1</text>
  <text class="sans lbl" x="923" y="400" text-anchor="end">refusal direction (r&#x0302;)</text>

  <!-- ghost of the original a -->
  <line x1="581" y1="372" x2="779" y2="278.7" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah-ghost)"/>
  <text class="sans ghostl" x="610" y="306">a (original)</text>
  <line x1="652" y1="311" x2="670" y2="330" stroke="#cbd5e1" stroke-width="1"/>

  <!-- removed component: dashed red arrow moving the tip back onto the perpendicular -->
  <line x1="779" y1="278.7" x2="594" y2="278.7" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>
  <text class="mono" x="686" y="266" text-anchor="middle" font-size="13.5" fill="#be123c">remove 3.0 &#183; r&#x0302;</text>

  <!-- cleaned vector -->
  <line x1="581" y1="372" x2="581" y2="278.7" stroke="#059669" stroke-width="3.5" marker-end="url(#ah-green)"/>
  <path d="M 595 372 L 595 358 L 581 358" fill="none" stroke="#059669" stroke-width="1.8"/>
  <text class="mono" x="581" y="252" text-anchor="middle" font-size="16" fill="#059669">a_clean</text>
  <text class="mono" x="581" y="230" text-anchor="middle" font-size="11.5" font-weight="400" fill="#94a3b8">&#8214;a_clean&#8214; = &#8730;2</text>

  <!-- zero projection at the origin -->
  <line x1="700" y1="424" x2="592" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="581" cy="372" r="6.5" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <circle cx="581" cy="372" r="2.5" fill="#e11d48"/>
  <text class="mono" x="706" y="430" font-size="14" fill="#047857">r&#x0302; &#183; a_clean = 0</text>

  <text class="sans cap" x="732.5" y="522" text-anchor="middle">cos &#952; = 0  &#8226;  refusal removed (perpendicular)</text>

  <!-- ================= FOOTNOTE ================= -->
  <text class="sans foot" x="490" y="566" text-anchor="middle">Shown in the 2-D plane containing r&#x0302; and a; drawn to scale &#8212; &#8214;a&#8214; = &#8730;11 &#8776; 3.32, projection = 3.0, perpendicular part = &#8730;2 &#8776; 1.41.</text>
</svg>
