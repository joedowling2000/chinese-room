<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Transformer architecture with residual stream and abliteration targets</title>
  <desc id="desc">A technical diagram showing token IDs converted to embeddings, a residual stream flowing through 88 repeated transformer layers, attention and MLP blocks writing back into the residual stream via o_proj and down_proj, and the final logits used to predict the next token.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .label { font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .tiny { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111827; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .soft { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 18; }
      .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 18; }
      .red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 18; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; }
      .line { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .line-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .residual { stroke: #2563eb; stroke-width: 8; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>

  <text x="70" y="68" class="title">Transformer architecture: what replaces the node-edge picture</text>
  <text x="70" y="100" class="subtitle">This model repeats the same block template 88 times. Each token position carries a 12,288-number residual vector through the stack.</text>

  <rect x="70" y="145" width="170" height="96" class="soft"/>
  <text x="155" y="178" text-anchor="middle" class="label">Text</text>
  <text x="155" y="205" text-anchor="middle" class="small">"hello world"</text>

  <path d="M240 193 H310" class="line"/>

  <rect x="310" y="145" width="205" height="96" class="soft"/>
  <text x="412" y="176" text-anchor="middle" class="label">Tokenizer</text>
  <text x="412" y="203" text-anchor="middle" class="small">token IDs</text>
  <text x="412" y="225" text-anchor="middle" class="mono">[15339, 1917, ...]</text>

  <path d="M515 193 H585" class="line"/>

  <rect x="585" y="145" width="230" height="96" class="green"/>
  <text x="700" y="176" text-anchor="middle" class="label">Embedding lookup</text>
  <text x="700" y="203" text-anchor="middle" class="small">each ID becomes</text>
  <text x="700" y="225" text-anchor="middle" class="mono">12,288 numbers</text>

  <path d="M815 193 H890" class="line-blue"/>

  <rect x="890" y="145" width="310" height="96" class="blue"/>
  <text x="1045" y="176" text-anchor="middle" class="label">Residual stream at layer 0</text>
  <text x="1045" y="203" text-anchor="middle" class="small">one vector per token position</text>
  <text x="1045" y="225" text-anchor="middle" class="mono">sequence_length × 12,288</text>

  <path d="M1045 241 V295" class="line-blue"/>

  <rect x="95" y="300" width="1210" height="470" class="box"/>
  <text x="130" y="342" class="label">Repeated transformer block template</text>
  <text x="130" y="371" class="small">Same architecture repeated 88 times; each layer has its own learned weights.</text>

  <rect x="135" y="420" width="250" height="78" class="blue"/>
  <text x="260" y="452" text-anchor="middle" class="label">Input residual</text>
  <text x="260" y="478" text-anchor="middle" class="mono">12,288-d vector</text>

  <path d="M385 459 H445" class="line-blue"/>

  <rect x="445" y="405" width="255" height="108" class="purple"/>
  <text x="572" y="436" text-anchor="middle" class="label">Self-attention</text>
  <text x="572" y="463" text-anchor="middle" class="small">looks across token positions</text>
  <text x="572" y="489" text-anchor="middle" class="mono">q_proj, k_proj, v_proj</text>

  <path d="M700 459 H755" class="line"/>

  <rect x="755" y="405" width="180" height="108" class="red"/>
  <text x="845" y="438" text-anchor="middle" class="label">o_proj</text>
  <text x="845" y="465" text-anchor="middle" class="small">attention write</text>
  <text x="845" y="491" text-anchor="middle" class="tiny">abliteration target</text>

  <path d="M935 459 C1005 459 1005 548 1075 548" class="line-red"/>

  <rect x="445" y="595" width="255" height="108" class="amber"/>
  <text x="572" y="626" text-anchor="middle" class="label">MLP / feed-forward</text>
  <text x="572" y="653" text-anchor="middle" class="small">processes this token state</text>
  <text x="572" y="679" text-anchor="middle" class="mono">gate_proj, up_proj</text>

  <path d="M700 649 H755" class="line"/>

  <rect x="755" y="595" width="180" height="108" class="red"/>
  <text x="845" y="628" text-anchor="middle" class="label">down_proj</text>
  <text x="845" y="655" text-anchor="middle" class="small">MLP write</text>
  <text x="845" y="681" text-anchor="middle" class="tiny">abliteration target</text>

  <path d="M935 649 C1005 649 1005 570 1075 570" class="line-red"/>

  <rect x="1075" y="505" width="190" height="108" class="blue"/>
  <text x="1170" y="538" text-anchor="middle" class="label">Add updates</text>
  <text x="1170" y="565" text-anchor="middle" class="small">residual = residual</text>
  <text x="1170" y="591" text-anchor="middle" class="small">+ attention + MLP</text>

  <path d="M260 498 V560 H1075" class="residual"/>
  <text x="585" y="547" text-anchor="middle" class="small" fill="#2563eb">main residual stream path</text>

  <path d="M1265 559 H1325" class="line-blue"/>
  <text x="1295" y="535" text-anchor="middle" class="mono">× 88</text>

  <path d="M1325 559 C1370 559 1370 790 1045 790 C740 790 410 790 260 790 C105 790 105 459 135 459" class="dash"/>
  <text x="1165" y="815" class="tiny">next layer receives the updated residual vector</text>

  <path d="M1045 770 V835" class="line-blue"/>

  <rect x="845" y="835" width="400" height="88" class="blue"/>
  <text x="1045" y="867" text-anchor="middle" class="label">Final residual at last token</text>
  <text x="1045" y="894" text-anchor="middle" class="small">converted to vocabulary scores</text>

  <path d="M845 879 H745" class="line"/>

  <rect x="510" y="835" width="235" height="88" class="green"/>
  <text x="627" y="867" text-anchor="middle" class="label">Logits / probabilities</text>
  <text x="627" y="894" text-anchor="middle" class="small">predict next token</text>

  <path d="M510 879 H415" class="line"/>

  <rect x="185" y="835" width="230" height="88" class="soft"/>
  <text x="300" y="867" text-anchor="middle" class="label">Append token</text>
  <text x="300" y="894" text-anchor="middle" class="small">repeat generation loop</text>

  <rect x="70" y="795" width="390" height="92" class="red" opacity="0.96"/>
  <text x="265" y="827" text-anchor="middle" class="label">Where abliteration acts</text>
  <text x="265" y="854" text-anchor="middle" class="small">It edits the two residual write-heads</text>
  <text x="265" y="878" text-anchor="middle" class="mono">o_proj and down_proj in every layer</text>
</svg>
